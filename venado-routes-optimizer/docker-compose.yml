services:
  db:
    image: postgis/postgis:15-3.4
    container_name: venado-postgis
    environment:
      POSTGRES_DB: venado
      POSTGRES_USER: venado
      POSTGRES_PASSWORD: venado
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venado -d venado"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: venado-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://venado:venado@db:5432/venado
      SECRET_KEY: venado-hackathon-local-secret
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SEED_ON_START: "true"
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: venado-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
